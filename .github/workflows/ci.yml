name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Llamarc42.Core.slnx
      - run: dotnet format Llamarc42.Core.slnx --verify-no-changes --no-restore --severity info
      - run: dotnet build Llamarc42.Core.slnx --configuration Release --no-restore
      - run: dotnet test Llamarc42.Core.slnx --configuration Release --no-build
